  <path d="M292 346H334" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <path d="M530 346H582" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <path d="M798 346H850" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>

  <text x="110" y="482" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">Read code from a higher level: architecture first, implementation second.</text>
  <text x="110" y="522" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">For engineers learning system design, software architecture, cloud native, data, AI, SRE, and security patterns.</text>
