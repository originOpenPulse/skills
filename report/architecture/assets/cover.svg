    <text x="24" y="38" fill="#D1FAE5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Boundary</text>
    <text x="24" y="66" fill="#6EE7B7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Modules &amp; services</text>
  </g>

  <g transform="translate(586 300)">
    <rect x="0" y="0" width="210" height="92" rx="14" fill="#2B1B33" stroke="#A855F7"/>
    <text x="24" y="38" fill="#F3E8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Dependency</text>
    <text x="24" y="66" fill="#D8B4FE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">DB, queue, cloud</text>
  </g>

  <g transform="translate(854 300)">
