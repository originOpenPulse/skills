<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Big Tech Architecture Atlas</title>
  <desc id="desc">A cover image for a practical software architecture atlas with patterns, diagrams, I/O, demos, and review checklists.</desc>
  <rect width="1280" height="640" fill="#0B1020"/>
  <rect x="70" y="70" width="1140" height="500" rx="28" fill="#11182C" stroke="#2A375D" stroke-width="2"/>
  <text x="110" y="170" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="64" font-weight="800">Big Tech Architecture Atlas</text>
  <text x="114" y="220" fill="#B6C2D9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="500">Patterns · Boundaries · Diagrams · I/O · Demos · Review Checklists</text>

  <g transform="translate(110 300)">
    <rect x="0" y="0" width="180" height="92" rx="14" fill="#17233D" stroke="#3B82F6"/>
    <text x="24" y="38" fill="#DBEAFE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Core</text>
    <text x="24" y="66" fill="#93C5FD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Business rules</text>
  </g>

  <g transform="translate(338 300)">
